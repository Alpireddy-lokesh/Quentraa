name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: queuesless
          POSTGRES_USER: queuesless_user
          POSTGRES_PASSWORD: queuesless_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queuesless -d queuesless"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test backend
        run: mvn clean test
        working-directory: ./backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: ./frontend

      - name: Build frontend
        run: npm run build
        working-directory: ./frontend
