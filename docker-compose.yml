version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: quentraa-postgres
    environment:
      POSTGRES_DB: queuesless
      POSTGRES_USER: queuesless_user
      POSTGRES_PASSWORD: queuesless_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesless -d queuesless"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quentraa-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/queuesless
      SPRING_DATASOURCE_USERNAME: queuesless_user
      SPRING_DATASOURCE_PASSWORD: queuesless_pass
      SERVER_PORT: 8080
      APP_JWT_SECRET: dev-only-jwt-secret-change-me-in-production-please-256bits
      APP_JWT_EXPIRATION: 3600000
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quentraa-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
