version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: queuesless-postgres
    environment:
      POSTGRES_DB: queuesless
      POSTGRES_USER: queuesless_user
      POSTGRES_PASSWORD: queuesless_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesless -d queuesless"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: